context:
  version: "0.11.0"

package:
  name: air
  version: ${{ version }}

source:
  url: https://github.com/posit-dev/air/archive/refs/tags/${{ version }}.tar.gz
  sha256: 07ce82c3200296afca23efdbc9aae1943c4d0b6dfd5aa3fa47353dd709dff648

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # work around Windows MAX_PATH (260 char) limitation with cargo/libgit2, cf. https://github.com/libgit2/libgit2/blob/main/docs/win32-longpaths.md
      - if: win
        then: $env.CARGO_HOME = 'C:\.cargo'
      # build main app and generate license data
      - cd crates/air
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=../../THIRDPARTY.yml
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
          - let bin = $prefix | path join bin/air
          - ^$bin generate-shell-completion bash | save ($prefix | path join share/bash-completion/completions/air)
          - ^$bin generate-shell-completion fish | save ($prefix | path join share/fish/vendor_completions.d/air.fish)
          - ^$bin generate-shell-completion zsh  | save ($prefix | path join share/zsh/site-functions/_air)

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell

tests:
  - script:
      - air --help
      - air --version
  - package_contents:
      bin:
        - air
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/bash-completion/completions/air
            - share/fish/vendor_completions.d/air.fish
            - share/zsh/site-functions/_air
        - if: win and build_platform == host_platform
          then:
            - Library/share/bash-completion/completions/air
            - Library/share/fish/vendor_completions.d/air.fish
            - Library/share/zsh/site-functions/_air
      strict: true

about:
  summary: An R formatter and language server
  description: |
    Air is an R formatter and language server, written in Rust.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://posit-dev.github.io/air/
  repository: https://github.com/posit-dev/air

extra:
  recipe-maintainers:
    - salim-b
